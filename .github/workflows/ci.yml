name: Phase 0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: forge_test
      PGUSER: forge_test
      PGPASSWORD: forge_ci_password
      APP_ORIGINS: http://127.0.0.1:3030,http://localhost:3030,http://127.0.0.1:5176
      FORGE_PORT: 3031
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forge_test
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge_test -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:integration
      - name: Build and start containers
        run: docker compose up --build --wait --wait-timeout 180
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
