services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3030
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-mad_erp}
      PGUSER: ${PGUSER:-forge}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env before starting Docker}
      APP_ORIGINS: http://127.0.0.1:${FORGE_PORT:-3030},http://localhost:${FORGE_PORT:-3030}
    ports:
      - "127.0.0.1:${FORGE_PORT:-3030}:3030"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-mad_erp}
      POSTGRES_USER: ${PGUSER:-forge}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env before starting Docker}
    volumes:
      - forge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  forge_postgres_data:
